[package]
name = "shadow-vault"
version = "0.23.0"
edition = "2021"

rust-version = "1.75"
description = "Zero-trust steganography and dual-layer hardware-bound encrypted vault (ChaCha20-Poly1305 + Argon2id + Windows DPAPI)"
authors = ["GHSFS"]
license = "Apache-2.0"
repository = "https://github.com/GHSFS/shadow-vault"
readme = "README.md"
keywords = ["steganography", "encryption", "vault", "security", "windows"]
categories = ["cryptography", "command-line-utilities"]

[[bin]]
name = "svault"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "wrap_help"] }
chacha20poly1305 = "0.10"
argon2 = "0.5"
sha2 = "0.10"
rand = "0.10"
crc32fast = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "1"
anyhow = "1"
colored = "2"
zeroize = { version = "1.8", features = ["derive"] }
x25519-dalek = { version = "2.0", features = ["zeroize", "static_secrets"] }
ml-kem = { version = "0.3", features = ["zeroize", "alloc"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
] }


[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
